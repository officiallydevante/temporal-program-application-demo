[project]
name = "program-demo"
version = "0.1.0"
description = "Temporal walkthrough demo: a form-triggered program-application workflow"
requires-python = ">=3.9"
dependencies = [
    "temporalio>=1.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools]
packages = ["program_demo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
